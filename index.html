<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ---------------------------------------------------------------------------
// Design tokens
// ---------------------------------------------------------------------------
const C = {
  ink: "#0E2420", inkPanel: "#15332D", inkLine: "#25473F",
  paper: "#F1EEE3", signal: "#E4572E", vector: "#C9D94C",
  muted: "#89ADA5", textDark: "#1B2B27", textLight: "#EDE9DC",
};

const FONT_IMPORT =
  "@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');";

function makeStrip(len) {
  const bases = ["A", "T", "C", "G"];
  let s = "";
  for (let i = 0; i < len; i++) s += bases[Math.floor(Math.random() * 4)];
  return s;
}

// ---------------------------------------------------------------------------
// Web-native features: Web Share API, Notification API (via the service
// worker, since Android Chrome requires showNotification through a
// registration rather than `new Notification()`), all with graceful fallback.
// ---------------------------------------------------------------------------
async function shareArticle(a) {
  try {
    if (navigator.share) { await navigator.share({ title: a.title, text: a.journal, url: a.url }); return; }
    await navigator.clipboard.writeText(a.url);
    alert("Lien copié dans le presse-papiers.");
  } catch (e) { /* partage annulé par l'utilisateur — rien à faire */ }
}

async function ensureNotifPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch (e) {}
  }
}

async function fireNotification(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    if (navigator.serviceWorker) {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, { body, icon: "icon-192.png" });
    } else {
      new Notification(title, { body });
    }
  } catch (e) {}
}

// ---------------------------------------------------------------------------
// Local persistence (favoris + sujets suivis)
// ---------------------------------------------------------------------------
const LS_FAVORIS = "dw_favoris";
const LS_TOPICS = "dw_topics";

function loadFavoris() { try { return JSON.parse(localStorage.getItem(LS_FAVORIS) || "[]"); } catch (e) { return []; } }
function saveFavoris(list) { localStorage.setItem(LS_FAVORIS, JSON.stringify(list)); }
function loadTopics() { try { return JSON.parse(localStorage.getItem(LS_TOPICS) || "[]"); } catch (e) { return []; } }
function saveTopics(list) { localStorage.setItem(LS_TOPICS, JSON.stringify(list)); }

// ---------------------------------------------------------------------------
// PubMed (NCBI E-utilities)
// ---------------------------------------------------------------------------
const EUTILS = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils";

async function pubmedSearch({ term, retmax = 20, reldate, sort = "date" }) {
  const params = new URLSearchParams({ db: "pubmed", term, retmax: String(retmax), sort, retmode: "json" });
  if (reldate) { params.set("reldate", String(reldate)); params.set("datetype", "edat"); }
  const searchRes = await fetch(`${EUTILS}/esearch.fcgi?${params.toString()}`);
  if (!searchRes.ok) throw new Error("esearch a échoué");
  const searchData = await searchRes.json();
  const ids = searchData?.esearchresult?.idlist || [];
  if (ids.length === 0) return [];
  const sumParams = new URLSearchParams({ db: "pubmed", id: ids.join(","), retmode: "json" });
  const sumRes = await fetch(`${EUTILS}/esummary.fcgi?${sumParams.toString()}`);
  if (!sumRes.ok) throw new Error("esummary a échoué");
  const sumData = await sumRes.json();
  const result = sumData?.result;
  if (!result) return [];
  return ids.filter((id) => result[id]).map((id) => {
    const item = result[id];
    const authors = (item.authors || []).slice(0, 3).map((a) => a.name).join(", ");
    return {
      pmid: id,
      title: item.title?.replace(/\.$/, "") || "(sans titre)",
      journal: item.source || "",
      pubdate: item.pubdate || "",
      authors: authors + ((item.authors || []).length > 3 ? " et al." : ""),
      url: `https://pubmed.ncbi.nlm.nih.gov/${id}/`,
    };
  });
}

// Vérifie chaque sujet suivi sur les 14 derniers jours et notifie si du
// nouveau apparaît. Se déclenche au chargement et à chaque retour au premier
// plan de l'onglet — PAS une notification garantie app/onglet fermé : pour ça
// il faudrait un vrai push serveur (Web Push + backend).
async function checkFollowedTopics(topics) {
  const updated = [];
  for (const t of topics) {
    try {
      const results = await pubmedSearch({ term: t.term, retmax: 20, reldate: 14, sort: "date" });
      const ids = results.map((r) => r.pmid);
      const newOnes = t.seen.length > 0 ? ids.filter((id) => !t.seen.includes(id)) : [];
      if (newOnes.length > 0) {
        const first = results.find((r) => r.pmid === newOnes[0]);
        await fireNotification(
          `${t.label} — ${newOnes.length} nouvelle${newOnes.length > 1 ? "s" : ""} publication${newOnes.length > 1 ? "s" : ""}`,
          first ? first.title : ""
        );
      }
      updated.push({ ...t, seen: ids.slice(0, 200), lastChecked: Date.now() });
    } catch (e) {
      updated.push(t);
    }
  }
  return updated;
}

// ---------------------------------------------------------------------------
// Static content
// ---------------------------------------------------------------------------
const FICHES = [
  { id: "dengue-virus", tag: "Virologie", title: "Le virus de la dengue",
    body: ["La dengue est causée par un Flavivirus à ARN simple brin positif, avec quatre sérotypes distincts (DENV-1 à DENV-4) partageant environ 65% de leur génome.",
    "L'infection par un sérotype confère une immunité durable contre celui-ci, mais seulement transitoire contre les autres — une infection secondaire par un sérotype différent est le principal facteur de risque de formes sévères (ADE)."],
    query: "dengue virus serotype pathogenesis" },
  { id: "dengue-clinique", tag: "Clinique & diagnostic", title: "Présentation clinique et diagnostic",
    body: ["La majorité des infections sont asymptomatiques ou pauci-symptomatiques. Les formes symptomatiques évoluent en trois phases : fébrile, critique (fuite plasmatique, J3-J7) puis récupération.",
    "Le diagnostic combine détection directe (RT-PCR, antigène NS1) en phase précoce et sérologie (IgM/IgG) plus tardive, avec des pièges de réactivité croisée entre flavivirus."],
    query: "dengue diagnosis NS1 RT-PCR serology cross-reactivity" },
  { id: "arbovirus-famille", tag: "Arbovirus", title: "Une famille sous surveillance",
    body: ["Les arbovirus regroupent des virus de familles variées transmis par des vecteurs hématophages — moustiques, tiques, phlébotomes — dont la dengue n'est qu'un membre parmi Zika, chikungunya, West Nile ou fièvre jaune.",
    "Leur point commun épidémiologique est la dépendance à la biologie du vecteur et une extension géographique guidée par le climat et l'urbanisation, en particulier pour Aedes aegypti et albopictus."],
    query: "arbovirus surveillance Aedes vector competence emerging" },
  { id: "genomique-surveillance", tag: "Génomique", title: "Séquençage et surveillance génomique",
    body: ["Le séquençage haut débit (NGS), y compris les technologies portables comme Oxford Nanopore, permet de suivre en temps quasi réel la circulation des lignées virales.",
    "En phylogénie, la reconstruction des relations entre souches permet de dater et localiser les évènements de diffusion géographique d'un génotype, comme pour des lignées de DENV-3 dans la Caraïbe."],
    query: "dengue genomic surveillance nanopore sequencing phylogenetics" },
];

const TOPIC_CHIPS = [
  { label: "Dengue", term: "dengue" }, { label: "DENV-3", term: "dengue virus 3" },
  { label: "Arbovirus", term: "arbovirus" }, { label: "Chikungunya", term: "chikungunya" },
  { label: "Zika", term: "zika" }, { label: "Diagnostic", term: "dengue diagnosis" },
  { label: "NGS / génomique", term: "dengue genomic sequencing" }, { label: "Phylogénie", term: "dengue phylogenetics" },
  { label: "Vecteur / Aedes", term: "Aedes vector" },
];

// ---------------------------------------------------------------------------
// UI building blocks
// ---------------------------------------------------------------------------
function IconButton({ onClick, active, children, title }) {
  return (
    <button onClick={onClick} title={title} className="text-sm px-2 py-1 rounded"
      style={{ fontFamily: "'IBM Plex Mono', monospace", background: active ? C.vector : "transparent", color: active ? C.ink : C.signal, border: `1px solid ${active ? C.vector : C.signal}` }}>
      {children}
    </button>
  );
}

function ArticleCard({ a, isFavori, onToggleFavori }) {
  return (
    <div className="p-4 mb-3 rounded" style={{ background: C.paper, borderLeft: `3px solid ${C.signal}` }}>
      <a href={a.url} target="_blank" rel="noopener noreferrer" className="block">
        <div className="text-xs mb-1 tracking-wide uppercase" style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.signal }}>{a.journal} · {a.pubdate}</div>
        <div className="text-base leading-snug mb-1" style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 600, color: C.textDark }}>{a.title}</div>
        <div className="text-sm mb-2" style={{ color: "#5B564A" }}>{a.authors}</div>
      </a>
      <div className="flex gap-2">
        <IconButton onClick={() => onToggleFavori(a)} active={isFavori} title="Ajouter aux favoris">
          {isFavori ? "★ Favori" : "☆ Favoris"}
        </IconButton>
        <IconButton onClick={() => shareArticle(a)} title="Partager">↗ Partager</IconButton>
      </div>
    </div>
  );
}

function FicheCard({ f, onApprofondir }) {
  return (
    <div className="p-5 rounded mb-4" style={{ background: C.paper }}>
      <div className="text-xs mb-2 tracking-wide uppercase" style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.signal, fontWeight: 500 }}>{f.tag}</div>
      <div className="text-xl mb-3" style={{ fontFamily: "'Bitter', serif", fontWeight: 700, color: C.textDark }}>{f.title}</div>
      {f.body.map((p, i) => (<p key={i} className="text-sm leading-relaxed mb-2" style={{ color: "#3A362C" }}>{p}</p>))}
      <button onClick={() => onApprofondir(f.query)} className="mt-2 text-xs px-3 py-2 rounded"
        style={{ fontFamily: "'IBM Plex Mono', monospace", background: C.ink, color: C.vector, fontWeight: 500 }}>
        → Approfondir dans la littérature
      </button>
    </div>
  );
}

function FluxTab({ favoris, onToggleFavori }) {
  const [articles, setArticles] = useState([]);
  const [status, setStatus] = useState("loading");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const results = await pubmedSearch({ term: "(dengue[Title/Abstract]) OR (arbovirus[Title/Abstract])", retmax: 15, reldate: 45, sort: "date" });
        if (!cancelled) { setArticles(results); setStatus("ok"); }
      } catch (e) { if (!cancelled) setStatus("error"); }
    })();
    return () => { cancelled = true; };
  }, []);

  const favoriIds = favoris.map((f) => f.pmid);

  return (
    <div>
      <div className="flex items-baseline justify-between mb-3">
        <h2 className="text-lg" style={{ fontFamily: "'Bitter', serif", fontWeight: 700, color: C.textLight }}>Publications récentes — 45 derniers jours</h2>
        <span className="text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.muted }}>source : PubMed</span>
      </div>
      {status === "loading" && <div className="text-sm" style={{ color: C.muted }}>Interrogation de PubMed…</div>}
      {status === "error" && <div className="p-4 rounded text-sm" style={{ background: C.inkPanel, color: C.textLight }}>Impossible de joindre PubMed pour le moment.</div>}
      {status === "ok" && articles.length === 0 && <div className="text-sm" style={{ color: C.muted }}>Aucun résultat sur cette fenêtre.</div>}
      {status === "ok" && articles.map((a) => (
        <ArticleCard key={a.pmid} a={a} isFavori={favoriIds.includes(a.pmid)} onToggleFavori={onToggleFavori} />
      ))}
      <div className="mt-6 pt-5" style={{ borderTop: `1px solid ${C.inkLine}` }}>
        <div className="text-xs mb-3 tracking-wide uppercase" style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.muted }}>Veille institutionnelle — accès direct</div>
        <div className="grid grid-cols-1 gap-2">
          {[
            { name: "OMS — Disease Outbreak News", url: "https://www.who.int/emergencies/disease-outbreak-news" },
            { name: "ProMED-mail", url: "https://promedmail.org/" },
            { name: "ECDC — Communicable Disease Threats Report", url: "https://www.ecdc.europa.eu/en/threats-and-outbreaks/communicable-disease-threats-report" },
            { name: "Santé publique France — Arboviroses", url: "https://www.santepubliquefrance.fr/maladies-et-traumatismes/maladies-a-transmission-vectorielle/dengue" },
          ].map((s) => (
            <a key={s.url} href={s.url} target="_blank" rel="noopener noreferrer" className="text-sm px-3 py-2 rounded flex items-center justify-between"
               style={{ background: C.inkPanel, color: C.textLight, border: `1px solid ${C.inkLine}` }}>{s.name}<span style={{ color: C.vector }}>↗</span></a>
          ))}
        </div>
      </div>
    </div>
  );
}

function RechercheTab({ presetQuery, onConsumePreset, favoris, onToggleFavori, topics, onToggleFollow }) {
  const [query, setQuery] = useState("dengue");
  const [reldate, setReldate] = useState("90");
  const [sort, setSort] = useState("date");
  const [results, setResults] = useState([]);
  const [status, setStatus] = useState("idle");

  const runSearch = useCallback(async (term, days, sortMode) => {
    setStatus("loading");
    try {
      const r = await pubmedSearch({ term, retmax: 25, reldate: days === "all" ? undefined : Number(days), sort: sortMode });
      setResults(r); setStatus("ok");
    } catch (e) { setStatus("error"); }
  }, []);

  useEffect(() => {
    if (presetQuery) { setQuery(presetQuery); runSearch(presetQuery, reldate, sort); onConsumePreset(); }
  }, [presetQuery]);

  useEffect(() => { runSearch(query, reldate, sort); }, []);

  const isFollowing = topics.some((t) => t.term === query);
  const favoriIds = favoris.map((f) => f.pmid);

  return (
    <div>
      <div className="mb-4">
        <div className="flex gap-2 mb-3">
          <input value={query} onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && runSearch(query, reldate, sort)}
            placeholder="Rechercher un sujet, un auteur, un sérotype…"
            className="flex-1 px-3 py-2 rounded text-sm"
            style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: C.paper, color: C.textDark, border: "none" }} />
          <button onClick={() => runSearch(query, reldate, sort)} className="px-4 py-2 rounded text-sm"
            style={{ fontFamily: "'IBM Plex Mono', monospace", background: C.signal, color: C.paper, fontWeight: 500 }}>Chercher</button>
        </div>

        <div className="flex flex-wrap gap-2 mb-3">
          {TOPIC_CHIPS.map((c) => (
            <button key={c.label} onClick={() => { setQuery(c.term); runSearch(c.term, reldate, sort); }}
              className="text-xs px-2 py-1 rounded"
              style={{ fontFamily: "'IBM Plex Mono', monospace", background: query === c.term ? C.vector : C.inkPanel, color: query === c.term ? C.ink : C.textLight, border: `1px solid ${C.inkLine}` }}>
              {c.label}
            </button>
          ))}
        </div>

        <button onClick={() => onToggleFollow(query, query)} className="text-xs px-3 py-2 rounded mb-3"
          style={{ fontFamily: "'IBM Plex Mono', monospace", background: isFollowing ? C.vector : C.inkPanel, color: isFollowing ? C.ink : C.textLight, border: `1px solid ${C.inkLine}` }}>
          {isFollowing ? "🔔 Sujet suivi — notifications actives" : "🔕 Suivre ce sujet et être notifié des nouveautés"}
        </button>

        {topics.length > 0 && (
          <div className="flex flex-wrap gap-2 mb-3">
            {topics.map((t) => (
              <span key={t.term} className="text-xs px-2 py-1 rounded flex items-center gap-1" style={{ background: C.inkPanel, color: C.muted, border: `1px solid ${C.inkLine}` }}>
                {t.label}
                <button onClick={() => onToggleFollow(t.term, t.label)} style={{ color: C.signal }}>✕</button>
              </span>
            ))}
          </div>
        )}

        <div className="flex gap-4 text-xs" style={{ color: C.muted, fontFamily: "'IBM Plex Mono', monospace" }}>
          <label className="flex items-center gap-1">Période :
            <select value={reldate} onChange={(e) => { setReldate(e.target.value); runSearch(query, e.target.value, sort); }}
              className="ml-1 px-1 py-0.5 rounded" style={{ background: C.inkPanel, color: C.textLight, border: `1px solid ${C.inkLine}` }}>
              <option value="30">30 jours</option><option value="90">90 jours</option><option value="365">1 an</option><option value="all">Tout</option>
            </select>
          </label>
          <label className="flex items-center gap-1">Tri :
            <select value={sort} onChange={(e) => { setSort(e.target.value); runSearch(query, reldate, e.target.value); }}
              className="ml-1 px-1 py-0.5 rounded" style={{ background: C.inkPanel, color: C.textLight, border: `1px solid ${C.inkLine}` }}>
              <option value="date">Date</option><option value="relevance">Pertinence</option>
            </select>
          </label>
        </div>
      </div>

      {status === "loading" && <div className="text-sm" style={{ color: C.muted }}>Recherche en cours…</div>}
      {status === "error" && <div className="text-sm p-3 rounded" style={{ background: C.inkPanel, color: C.textLight }}>La recherche a échoué.</div>}
      {status === "ok" && results.length === 0 && <div className="text-sm" style={{ color: C.muted }}>Aucun résultat pour cette combinaison de filtres.</div>}
      {status === "ok" && results.map((a) => (
        <ArticleCard key={a.pmid} a={a} isFavori={favoriIds.includes(a.pmid)} onToggleFavori={onToggleFavori} />
      ))}
    </div>
  );
}

function ApprendreTab({ onApprofondir }) {
  return (
    <div>
      <h2 className="text-lg mb-4" style={{ fontFamily: "'Bitter', serif", fontWeight: 700, color: C.textLight }}>Fiches de synthèse</h2>
      {FICHES.map((f) => (<FicheCard key={f.id} f={f} onApprofondir={onApprofondir} />))}
    </div>
  );
}

function FavorisTab({ favoris, onToggleFavori }) {
  return (
    <div>
      <h2 className="text-lg mb-4" style={{ fontFamily: "'Bitter', serif", fontWeight: 700, color: C.textLight }}>Favoris</h2>
      {favoris.length === 0 && (
        <div className="text-sm" style={{ color: C.muted }}>
          Aucun favori pour l'instant — touche ☆ sur un article dans Flux ou Recherche pour le garder ici, consultable sans connexion.
        </div>
      )}
      {favoris.map((a) => (<ArticleCard key={a.pmid} a={a} isFavori={true} onToggleFavori={onToggleFavori} />))}
    </div>
  );
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [tab, setTab] = useState("flux");
  const [presetQuery, setPresetQuery] = useState(null);
  const [strip] = useState(() => makeStrip(64));
  const [favoris, setFavoris] = useState(() => loadFavoris());
  const [topics, setTopics] = useState(() => loadTopics());

  useEffect(() => { saveFavoris(favoris); }, [favoris]);
  useEffect(() => { saveTopics(topics); }, [topics]);

  const toggleFavori = (article) => {
    setFavoris((prev) => {
      const exists = prev.some((f) => f.pmid === article.pmid);
      return exists ? prev.filter((f) => f.pmid !== article.pmid) : [{ ...article, savedAt: Date.now() }, ...prev];
    });
  };

  const toggleFollow = (term, label) => {
    setTopics((prev) => {
      const exists = prev.some((t) => t.term === term);
      return exists ? prev.filter((t) => t.term !== term) : [...prev, { term, label, seen: [] }];
    });
  };

  // Vérifie les sujets suivis au chargement, puis à chaque retour au premier plan de l'onglet.
  useEffect(() => {
    ensureNotifPermission();
    let mounted = true;
    (async () => {
      const current = loadTopics();
      if (current.length === 0) return;
      const updated = await checkFollowedTopics(current);
      if (mounted) setTopics(updated);
    })();
    const onVisible = async () => {
      if (document.visibilityState === "visible") {
        const current = loadTopics();
        if (current.length === 0) return;
        const updated = await checkFollowedTopics(current);
        setTopics(updated);
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => { mounted = false; document.removeEventListener("visibilitychange", onVisible); };
  }, []);

  const goToSearch = (term) => { setPresetQuery(term); setTab("recherche"); };

  const TABS = [
    { id: "flux", label: "Flux" }, { id: "recherche", label: "Recherche" },
    { id: "favoris", label: `Favoris${favoris.length ? ` (${favoris.length})` : ""}` },
    { id: "apprendre", label: "Apprendre" },
  ];

  return (
    <div style={{ background: C.ink, minHeight: "100vh" }}>
      <style>{FONT_IMPORT}</style>
      <header className="px-5 pt-6 pb-4" style={{ borderBottom: `1px solid ${C.inkLine}` }}>
        <div className="text-xs mb-2 tracking-widest" style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.vector, letterSpacing: "0.15em" }}>{strip}</div>
        <h1 className="text-3xl mb-1" style={{ fontFamily: "'Bitter', serif", fontWeight: 900, color: C.textLight, letterSpacing: "-0.01em" }}>DengueWatch</h1>
        <p className="text-sm" style={{ color: C.muted, fontFamily: "'IBM Plex Sans', sans-serif" }}>Veille scientifique — dengue &amp; arbovirus</p>
      </header>
      <nav className="flex px-5 gap-1 flex-wrap" style={{ borderBottom: `1px solid ${C.inkLine}` }}>
        {TABS.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} className="px-4 py-3 text-sm"
            style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 500, color: tab === t.id ? C.ink : C.muted, background: tab === t.id ? C.vector : "transparent", borderTopLeftRadius: 4, borderTopRightRadius: 4 }}>
            {t.label}
          </button>
        ))}
      </nav>
      <main className="px-5 py-5 max-w-2xl mx-auto">
        {tab === "flux" && <FluxTab favoris={favoris} onToggleFavori={toggleFavori} />}
        {tab === "recherche" && (
          <RechercheTab presetQuery={presetQuery} onConsumePreset={() => setPresetQuery(null)}
            favoris={favoris} onToggleFavori={toggleFavori} topics={topics} onToggleFollow={toggleFollow} />
        )}
        {tab === "favoris" && <FavorisTab favoris={favoris} onToggleFavori={toggleFavori} />}
        {tab === "apprendre" && <ApprendreTab onApprofondir={goToSearch} />}
      </main>
      <footer className="px-5 py-4 text-xs text-center" style={{ color: C.inkLine }}>
        PubMed / NCBI E-utilities · les sujets suivis sont vérifiés à l'ouverture de l'app
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
